server {
    # 8080, not 80: an arbitrary non-root UID cannot bind a privileged port.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Send relative Location headers. With the default absolute_redirect the
    # redirect below comes back as http://<host>:8080/chatbot/ - nginx appends
    # its own listening port, which is invisible behind the OpenShift router
    # and would drop the browser onto a dead address (and off TLS).
    absolute_redirect off;

    # The Vite build sets base "/chatbot/", so every asset URL the bundle emits
    # carries that prefix. The nginx-ingress `rewrite-target` annotation used to
    # strip it before the request arrived; OpenShift's HAProxy router cannot
    # rewrite paths, so the prefix is served here and the app's public URLs
    # (including the Module Federation remoteEntry.js) stay exactly as they were.
    location = / {
        return 302 /chatbot/;
    }

    # Serve static asset folders correctly
    location /chatbot/assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Allow static file extensions
    location ~* ^/chatbot/.+\.(js|css|json|png|jpg|jpeg|svg|gif|ico|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React SPA fallback
    location /chatbot/ {
        try_files $uri $uri/ /chatbot/index.html;
    }

    # Probe target - static files alone give the kubelet nothing cheap to hit.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
