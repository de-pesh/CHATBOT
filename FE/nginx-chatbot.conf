# Dropped into /opt/app-root/etc/nginx.default.d/ - included INSIDE the fixed
# server{} block the ubi9/nginx-124 image's entrypoint generates (listen 8080,
# root /opt/app-root/src). Only location/server-context directives belong
# here, not a server{} wrapper of our own.

# Send relative Location headers. With the default absolute_redirect the
# redirect below comes back as http://<host>:8080/chatbot/ - nginx appends
# its own listening port, which is invisible behind the OpenShift router and
# would drop the browser onto a dead address (and off TLS).
absolute_redirect off;

location = / {
    return 302 /chatbot/;
}

location /chatbot/assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~* ^/chatbot/.+\.(js|css|json|png|jpg|jpeg|svg|gif|ico|woff|woff2|ttf|eot)$ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /chatbot/ {
    try_files $uri $uri/ /chatbot/index.html;
}

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
