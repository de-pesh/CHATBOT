pool:
  vmImage: 'ubuntu-latest'

variables:
  containerName: 'uandccpacs01'
  repository: 'parsing-service'
  deploy_file_path: 'k8s/deployment.yaml'

steps:
- checkout: self
  persistCredentials: true
  clean: true
  fetchDepth: 0

- task: AzureCLI@2
  displayName: 'Update deployment.yaml with next image tag from ACR'
  inputs:
    azureSubscription: 'CI/CD-CCPM'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      echo "Fetching latest tag from ACR..."
      currentNamespace=$(az acr repository show-tags \
        --name $(containerName) \
        --repository $(repository) \
        --output tsv | grep -E '^v[0-9]+$' | sort -V | tail -n 1)

      if [ -z "$currentNamespace" ]; then
        nextNamespace="v1"
      else
        num=${currentNamespace#v}
        nextNamespace="v$((num + 1))"
      fi

      echo "Current ACR tag: $currentNamespace"
      echo "Next tag to use: $nextNamespace"

      echo "Updating deployment.yaml..."
      sed -i'' -E \
        "s#(image:[[:space:]]*\"?$(containerName)\.azurecr\.io/$(repository)):[^\"[:space:]]+#\1:$nextNamespace#gI" \
        $(deploy_file_path)

      echo "Image lines AFTER update:"
      grep -n "image:" $(deploy_file_path)

      git config user.email "build@azuredevops.com"
      git config user.name "Azure DevOps Pipeline"

      git add $(deploy_file_path)
      git commit -m "[skip ci] Update image tag to $nextNamespace" || echo "No changes to commit"

      git push origin HEAD:refs/heads/$(repository)

      echo "##vso[task.setvariable variable=ImageNamespace]$nextNamespace"
    addSpnToEnvironment: true
    workingDirectory: '$(System.DefaultWorkingDirectory)'

- task: AzureCLI@2
  displayName: 'Build and push image to ACR'
  inputs:
    azureSubscription: 'CI/CD-CCPM'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Building image: $(containerName).azurecr.io/$(repository):$(ImageNamespace)"

      az acr build \
        --registry $(containerName) \
        --image $(repository):$(ImageNamespace) \
        .
    addSpnToEnvironment: true
    workingDirectory: '$(System.DefaultWorkingDirectory)'
