pool:
  vmImage: 'ubuntu-latest'

variables:
  # Define a variable for the container name
  containerName: 'UANDCCPACS01'
  
steps:
- task: CmdLine@2
  inputs:
    script: 'sudo apt-get install azure-functions-core-tools-4'

# Fetch the current Docker namespace for a specific image
- task: AzureCLI@2
  inputs:
    azureSubscription: 'CI/CD-CCPM'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |

      # Get all tags for the specified image, sort them numerically (ignoring "v"), and get the highest one
      currentNamespace=$(az acr repository show-tags --name $(containerName) --repository $(repository) --output tsv | grep -E '^v[0-9]+$' | sort -V | tail -n 1)
      
      # Check if there is an existing namespace; if not, start with v1
      if [ -z "$currentNamespace" ]; then
        nextNamespace="v1"
      else
        # Extract the numeric part of the tag by removing the "v" prefix
        currentNumber=${currentNamespace#v}
        
        # Increment the number
        nextNumber=$((currentNumber + 1))
        
        # Add the "v" prefix back to form the new tag
        nextNamespace="v$nextNumber"
      fi

      echo "Current Namespace for $(repository): $currentNamespace"
      echo "Next Namespace: $nextNamespace"

      # Export the next namespace to be used later
      echo "##vso[task.setvariable variable=ImageNamespace]$nextNamespace"
    addSpnToEnvironment: true
    useGlobalConfig: true
    workingDirectory: '$(System.DefaultWorkingDirectory)'

# Build the Docker image using the incremented namespace
- task: AzureCLI@2
  inputs:
    azureSubscription: 'CI/CD-CCPM'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az acr build --registry $(containerName) --image $(repository):$(ImageNamespace) .
    addSpnToEnvironment: true
    useGlobalConfig: true
    workingDirectory: '$(System.DefaultWorkingDirectory)'