# Full local CCPM stack - every service runs as a container.
#
#   docker compose build          # first time (long: the two rpc servers pull
#                                 # torch and a ~600 MB HF model each)
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f main-service
#   docker compose down           # add -v to wipe the databases too
#
# The UI is on http://localhost:3006 (nginx redirects to /chatbot/).
# The browser talks to chatbot-inferencing-service directly on :8003
# (FE/src/main.tsx hardcodes that URL), so that port stays published.
#
# Ports match GUIDE.md, so the layout is the same one start-all-services.sh
# produced natively: main-service 8000, indexing-rpc 8001, inferencing 8003,
# redis 6379, mongo 27017, mysql 3306,
# UI 3006.

# ---------------------------------------------------------------------------
# Shared settings. Service names replace the 127.0.0.1 addresses in the
# per-service .env files - those files are listed in every .dockerignore and
# never reach the image, so everything a service needs is spelled out here.
# ---------------------------------------------------------------------------
x-infra-env: &infra-env
  REDIS_URL: "redis://redis:6379/0"
  DB_CONNECTION_STRING: "Server=mysql;UserID=root;Password=pass;Database=ccpm"
  MONGO_CONNECTION_STRING: "mongodb://mongo:27017/?directConnection=true"
  MONGO_DATABASE_NAME: "ccpm"
  DATABASE_SERVICE_URL: "http://main-service:8000"
  MAIN_SERVICE_URL: "http://main-service:8000"
  INDEXING_RPC_SERVER: "indexing-rpc-server:8001"
  WORKER_BRPOP_TIMEOUT: "5"
  WORKER_ERROR_RETRY_DELAY: "5"

# Queue names have to agree between producers and consumers. One queue is left:
#   chatbot_queue  main-service -> chatbot-inferencing-service (in-process worker)
# parser_queue, llm_queue and assessment_kb_queue went with the assessment
# pipeline - main-service opened a connection to each and nothing ever drained
# them, so the settings were dropped from config.py too.
x-queue-env: &queue-env
  CHATBOT_QUEUE_NAME: "chatbot_queue"
  CHATBOT_QUEUE_DLQ_NAME: "chatbot_queue_dlq"
  CHATBOT_QUEUE_MAX_RETRIES: "3"

# Azure Blob is external and reached over the internet; four services need it.
# Values come from the .env file next to this one (compose loads it).
x-blob-env: &blob-env
  AZURE_STORAGE_ACCOUNT_URL: "https://${AZURE_STORAGE_ACCOUNT_NAME}.blob.core.windows.net"
  AZURE_STORAGE_ACCOUNT_NAME: "${AZURE_STORAGE_ACCOUNT_NAME}"
  AZURE_STORAGE_ACCOUNT_KEY: "${AZURE_STORAGE_ACCOUNT_KEY}"
  AZURE_STORAGE_CONTAINER_NAME: "${AZURE_STORAGE_CONTAINER_NAME}"
  BLOB_CONTAINER_NAME: "${AZURE_STORAGE_CONTAINER_NAME}"
  BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=${AZURE_STORAGE_ACCOUNT_NAME};AccountKey=${AZURE_STORAGE_ACCOUNT_KEY};EndpointSuffix=core.windows.net"

x-azure-openai-env: &azure-openai-env
  AZURE_OPENAI_API_KEY: "${AZURE_OPENAI_API_KEY}"
  AZURE_OPENAI_ENDPOINT: "${AZURE_OPENAI_ENDPOINT}"
  AZURE_OPENAI_API_VERSION: "${AZURE_OPENAI_API_VERSION}"
  AZURE_OPENAI_DEPLOYMENT_NAME: "${AZURE_OPENAI_DEPLOYMENT_NAME}"

x-python-build-args: &python-build-args
  BASE_REGISTRY: registry.access.redhat.com
  PIP_INDEX_URL: ""
  PIP_TRUSTED_HOST: ""

x-svc-defaults: &svc-defaults
  restart: unless-stopped
  networks: [ccpm]

services:

  # ---------------------------------------------------------------- infra ---

  # Plain standalone Redis. The client code used redis.asyncio.cluster with a
  # hand-rolled single-node "cluster" (custom image + an addslotsrange init
  # hack) for what is one queue - and that also made the managed Azure Cache
  # instance unusable in the OpenShift deploy, which is not cluster-mode.
  redis:
    image: redis:7-alpine
    container_name: ccpm-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [ccpm]

  # Replaces the hand-started docker-mongo-1 container the native script used.
  mongo:
    image: mongo:7
    container_name: ccpm-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [ccpm]

  mysql:
    image: mysql:8
    container_name: ccpm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: ccpm
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # The schema start-all-services.sh used to apply by hand. Numbered
      # because the entrypoint runs these in filename order - and only once,
      # on a fresh volume.
      - ./main-service/scripts/files_table_and_procedures.sql:/docker-entrypoint-initdb.d/01-files_table_and_procedures.sql:ro
      - ./main-service/scripts/files_knowledge_base_column.sql:/docker-entrypoint-initdb.d/02-files_knowledge_base_column.sql:ro
      - ./main-service/scripts/get_files_by_entity_procedure.sql:/docker-entrypoint-initdb.d/03-get_files_by_entity_procedure.sql:ro
      - ./main-service/scripts/chatbot_tables_and_procedures.sql:/docker-entrypoint-initdb.d/04-chatbot_tables_and_procedures.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppass"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks: [ccpm]

  # ------------------------------------------------------------- services ---

  main-service:
    <<: *svc-defaults
    build:
      context: ./main-service
      args: *python-build-args
    image: ccpm/main-service:local
    container_name: ccpm-main-service
    environment:
      <<: [*infra-env, *queue-env, *blob-env]
      DEBUG: "True"
      # Local only: skips JWT validation so the UI works without an auth server.
      DISABLE_AUTH: "True"
      STORAGE_TYPE: "azure"
      AZURE_STORAGE_SAS_EXPIRY_MINUTES: "30"
      CHATBOT_INFERENCING_SERVICE_URL: "http://chatbot-inferencing-service:8000"
      SECRET_KEY: "ccpm-local-dev-secret-key"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    ports:
      - "8000:8000"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}

  indexing-rpc-server:
    <<: *svc-defaults
    build:
      context: ./indexing-rpc-server
      args:
        BASE_REGISTRY: registry.access.redhat.com
        PIP_INDEX_URL: ""
        PIP_TRUSTED_HOST: ""
        EPEL_RPM_URL: https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
        # Use "vendored" instead once vendor/gte-multilingual-base is populated.
        HF_MODEL_MODE: download
    image: ccpm/indexing-rpc-server:local
    container_name: ccpm-indexing-rpc-server
    environment:
      <<: [*infra-env, *blob-env]
      GRPC_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      mongo: {condition: service_healthy}

  # Published on 8003 because FE/src/main.tsx points the browser at
  # http://localhost:8003/chat; uvicorn listens on 8000 inside the container.
  chatbot-inferencing-service:
    <<: *svc-defaults
    build:
      context: ./chatbot-inferencing-service
      args:
        BASE_REGISTRY: registry.access.redhat.com
        PIP_INDEX_URL: ""
        PIP_TRUSTED_HOST: ""
        EPEL_RPM_URL: https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm
        # tesseract* / qpdf / unpaper are not in UBI9 or EPEL9; skip rather than
        # fail. Only scanned-PDF OCR needs them.
        OCR_MODE: optional
    image: ccpm/chatbot-inferencing-service:local
    container_name: ccpm-chatbot-inferencing-service
    environment:
      <<: [*infra-env, *queue-env, *blob-env, *azure-openai-env]
      MONGODB_COLLECTION_NAME: "chatbot_policies"
      # Ollama fallback, used only when the Azure OpenAI vars above are unset.
      LLM_API_URL: "http://127.0.0.1:11434"
      MODEL_NAME: "phi4"
      TEMPERATURE: "0.1"
      RPC_SERVER: "indexing-rpc-server:8001"
    ports:
      - "8003:8000"
    depends_on:
      mysql: {condition: service_healthy}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}

  # nginx serving the built SPA under /chatbot/. BUILD_SCRIPT=build:local drops
  # the Module Federation remote vite.qa.ts pulls from a public IP - the
  # standalone app imports nothing from it.
  frontend:
    <<: *svc-defaults
    build:
      context: ./FE
      args:
        NODE_IMAGE: node:20-alpine
        NGINX_IMAGE: nginxinc/nginx-unprivileged:1.25-alpine
        NPM_REGISTRY: ""
        BUILD_SCRIPT: "build:local"
    image: ccpm/chatbot-fe:local
    container_name: ccpm-frontend
    ports:
      - "3006:8080"
    depends_on:
      - chatbot-inferencing-service

networks:
  ccpm:
    name: ccpm

volumes:
  redis-data:
  mongo-data:
  mysql-data:
