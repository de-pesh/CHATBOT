[tool.poetry]
name = "chatbot-inferencing"
version = "0.1.0"
description = ""
authors = ["Urvi Dhasmana <urvi.dhasmana@in.ey.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["all"], version = "^0.116.1"}
uvicorn = {extras = ["standard"], version = "^0.35.0"}
aiohttp = "^3.12.14"
azure-storage-blob = "^12.25.1"
aiomysql = "^0.2.0"
webdavclient3 = "^3.14.6"
grpcio = "^1.74.0"
grpcio-tools = "^1.74.0"
langchain-ollama = "^0.3.7"
langchain-openai = "^0.3.0"
motor = "^3.7.0"
# Document parsing, folded in from parsing-rpc-server. Deliberately no torch or
# transformers: the embedding model stays in indexing-rpc-server.
numpy = "^2.1.0"
pymupdf = "^1.25.5"
pillow = "^11.2.1"
ocrmypdf = "^16.10.2"
openpyxl = "^3.1.5"
langchain-azure-ai = "^0.1.5"
# KB queue worker, absorbed from chatbot-kb-management-service.
redis = "5.2.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
