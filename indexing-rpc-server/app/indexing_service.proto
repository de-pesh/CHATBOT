// Source of truth for the stubs next to this file.
//
// The generated *_pb2.py / *_pb2_grpc.py were committed without this .proto for
// a long time, so the contract could not be regenerated or reviewed. Regenerate
// with grpcio-tools (a dev dependency), run from the service root:
//
//   python -m grpc_tools.protoc -I. --python_out=. --grpc_python_out=. \
//       app/indexing_service.proto
//
// main-service holds a copy of the generated stubs; regenerate both together.

syntax = "proto3";

package app;

import "google/protobuf/struct.proto";

// ---------------------------------------------------------------------------
// Vector store: embedding, indexing and similarity search.
// ---------------------------------------------------------------------------

message IndexRequest {
  string collection_name = 1;
  string file_path = 2;
  google.protobuf.Struct metadata = 3;
  bool is_policy = 4;
}

message IndexResponse {
  bool success = 1;
  string message = 2;
  string file_id = 3;
}

message UpdateRequest {
  string collection_name = 1;
  bool is_policy = 2;
  string file_id = 3;
  string file_path = 4;
  google.protobuf.Struct metadata = 5;
}

message UpdateResponse {
  bool success = 1;
  string message = 2;
  string file_id = 3;
}

message DeleteRequest {
  string collection_name = 1;
  string file_id = 2;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

message SearchRequest {
  string collection_name = 1;
  string query = 2;
}

message SearchResult {
  string id = 1;
  float score = 2;
  google.protobuf.Struct metadata = 3;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

service VectorService {
  rpc Index(IndexRequest) returns (IndexResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
}

// ---------------------------------------------------------------------------
// Document parsing: text extraction and OCR.
//
// Both sides already reach Azure Blob Storage, so the payload stays out of the
// RPC: the caller uploads the original and passes its blob path, the parser
// writes the extracted text back to blob and returns that path, which is then
// handed straight to Index.
//
// The older parsing-rpc-server returned only blob_path, leaving the caller to
// infer failure from an empty string. success/message match the other responses
// here so a parse error crosses the wire intact.
// ---------------------------------------------------------------------------

message ParseFileRequest {
  string file_path = 1;
}

message ParseFileResponse {
  bool success = 1;
  string message = 2;
  string blob_path = 3;
}

service ParsingService {
  rpc ParseFile(ParseFileRequest) returns (ParseFileResponse);
}
