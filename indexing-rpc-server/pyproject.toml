[tool.poetry]
name = "indexing-service"
version = "0.1.0"
description = ""
authors = ["Prashant Singh <prashant.singh3@in.ey.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
azure-storage-blob = "^12.25.1"
motor = "^3.7.0"
pydantic-settings = "^2.8.1"
aiohttp = "^3.11.16"
sentence-transformers = "^4.0.2"
# torch comes in transitively via sentence-transformers, and PyPI's default
# linux wheel is the CUDA build: 3.2 GB of nvidia-* libs plus a 1.2 GB torch,
# on a workload where torch.cuda.is_available() is False. Pinning it to the
# CPU index keeps the image a fraction of the size.
# CLOSED NETWORK: repoint this source at an internal mirror of
# download.pytorch.org/whl/cpu, or the build cannot resolve torch.
torch = {version = "^2.0", source = "pytorch-cpu"}
langchain-text-splitters = "^0.3.8"

# Document parsing (ParsingService.ParseFile), moved here from the chat
# service so the OCR toolchain sits with torch in the compute image rather
# than in the control plane. ocrmypdf also needs tesseract, ghostscript and
# friends as RPMs - see the Dockerfile.
pymupdf = "^1.25.5"
pillow = "^11.2.1"
ocrmypdf = "^16.10.2"
openpyxl = "^3.1.5"
langchain-azure-ai = "^0.1.5"
grpcio = "^1.73.0"
# The generated *_pb2.py stubs import google.protobuf directly, so it is a
# real runtime dependency. It used to arrive transitively via grpcio-tools
# (grpcio itself does not depend on it); when that moved to the dev group
# the inferencing service died at import with "No module named 'google'".
protobuf = "*"


[tool.poetry.group.dev.dependencies]
# Code generation only: regenerates *_pb2.py from a .proto. The generated stubs
# are committed and no .proto ships in this repo, so nothing at runtime imports
# grpc_tools - it was costing 7.8 MB in every image.
grpcio-tools = "^1.73.0"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
