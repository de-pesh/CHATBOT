trigger:
- llm_service

pool:
  vmImage: 'ubuntu-latest'

variables:
  # ACR details
  ACR_NAME: 'uandccpacs01'
  REPOSITORY: 'llm-service'

  # Kubernetes Repo (Repo B)
  MANIFEST_REPO_URL: 'https://dev.azure.com/EYGS2/ccpm-project/_git/k8s-ccpm'
  MANIFEST_REPO_BRANCH: 'manifests'

  # Path to deployment file inside Repo B
  DEPLOY_FILE_PATH: 'overlays/ccpm-llm-service/ccpm-llm-service-deploy.yaml'


steps:

# Checkout Repo A
- checkout: self

# 1️⃣ Auto-increment tag from ACR
- task: AzureCLI@2
  displayName: "Get next image tag"
  inputs:
    azureSubscription: 'CI/CD-CCPM'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |

      echo "Fetching latest tag from ACR..."

      latestTag=$(az acr repository show-tags \
        --name $ACR_NAME \
        --repository $REPOSITORY \
        --output tsv \
        | grep -E '^v[0-9]+$' \
        | sort -V \
        | tail -n 1)

      if [ -z "$latestTag" ]; then
        nextTag="v1"
      else
        num=${latestTag#v}
        nextNum=$((num + 1))
        nextTag="v$nextNum"
      fi

      echo "Latest tag: $latestTag"
      echo "Next tag:   $nextTag"

      echo "##vso[task.setvariable variable=NEXT_TAG]$nextTag"


# 2️⃣ Build and push new Docker image
- task: AzureCLI@2
  displayName: "Build & push image to ACR"
  inputs:
    azureSubscription: 'CI/CD-CCPM'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Building image: $REPOSITORY:${NEXT_TAG}"

      az acr build \
        --registry $ACR_NAME \
        --image $REPOSITORY:${NEXT_TAG} \
        .


# 3️⃣ Clone Kubernetes repo (Repo B)
- script: |
    echo "Cloning Kubernetes repo..."

    # Git URL with username + PAT for authentication
    git clone https://$GIT_USER:$PAT@dev.azure.com/EYGS2/ccpm-project/_git/k8s-ccpm manifests

    cd manifests
    git checkout $MANIFEST_REPO_BRANCH

  displayName: "Clone K8s repo"
  env:
    PAT: $(MANIFEST_REPO_PAT)    # Secret variable created in Azure DevOps
    GIT_USER: azuredevops        # Dummy username (any value works)


# 4️⃣ Update deploy YAML with new image tag
- script: |
    cd manifests

    echo "Updating image in: $DEPLOY_FILE_PATH"

    sed -i "s#$ACR_NAME.azurecr.io/$REPOSITORY:v[0-9]\+#$ACR_NAME.azurecr.io/$REPOSITORY:$NEXT_TAG#g" \
        $DEPLOY_FILE_PATH

    echo "Updated file content:"
    cat $DEPLOY_FILE_PATH

  displayName: "Update image tag in deploy.yaml"


# 5️⃣ Commit & push updated manifest
- script: |
    cd manifests

    git config user.email "pipeline@devops"
    git config user.name "Azure DevOps Pipeline"

    git add $DEPLOY_FILE_PATH
    git commit -m "Auto bump llm-service image tag to $NEXT_TAG"
    
    git push https://$GIT_USER:$PAT@dev.azure.com/EYGS2/ccpm-project/_git/k8s-ccpm HEAD:$MANIFEST_REPO_BRANCH

  displayName: "Commit and push updates to K8s repo"
  env:
    PAT: $(MANIFEST_REPO_PAT)
    GIT_USER: azuredevops