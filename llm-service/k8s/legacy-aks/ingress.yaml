apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llm-service-ingress
  namespace: ai-common
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /llm-service(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: llm-service
            port:
              number: 80