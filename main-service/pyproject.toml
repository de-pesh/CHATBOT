[tool.poetry]
name = "main-service"
version = "0.1.0"
description = ""
authors = ["Prashant Singh <prashant.singh3@in.ey.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["all"], version = "^0.116.1"}
uvicorn = {extras = ["standard"], version = "^0.35.0"}
aiohttp = "^3.12.14"
bcrypt = "^4.1.3"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
azure-storage-blob = "^12.25.1"
aiomysql = "^0.2.0"
redis = "5.2.1"
webdavclient3 = "^3.14.6"

# Chat, absorbed from chatbot-inferencing-service.
grpcio = "^1.74.0"
# The generated *_pb2.py stubs import google.protobuf directly; grpcio does not
# depend on it, so it has to be declared.
protobuf = "*"
langchain-openai = "^0.3.0"
langchain-ollama = "^0.3.7"
langchain-core = "^0.3.0"
motor = "^3.7.0"


[tool.poetry.group.dev.dependencies]
# Regenerates the *_pb2.py stubs from indexing-rpc-server/app/indexing_service.proto.
grpcio-tools = "^1.74.0"
pytest = "^8.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
