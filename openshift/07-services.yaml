apiVersion: v1
kind: Service
metadata:
  name: main-service
spec:
  selector:
    app: main-service
  ports:
    - port: 8000
      targetPort: 8000

---
# Name must be "parsing-indexing-service" - main-service-config's INDEXING_SERVICE_URL
# (openshift/02-configmap.yaml) resolves this Service by that exact name.
apiVersion: v1
kind: Service
metadata:
  name: parsing-indexing-service
spec:
  selector:
    app: parsing-indexing-service
  ports:
    - port: 8001
      targetPort: 8001

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
