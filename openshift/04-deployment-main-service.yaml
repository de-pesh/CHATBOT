apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-service
  labels:
    app: main-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-service
  template:
    metadata:
      labels:
        app: main-service
    spec:
      # See openshift/03-pvc.yaml: the arbitrary UID OpenShift assigns this
      # pod always lands in GID 0 (baked into the UBI9 image's own user
      # database, not a Kubernetes setting) - fsGroup: 0 makes the PVC mount
      # Remove if quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/chatbot-main-service is a public repository.
      # LiteLLM proxy hostname - cluster CoreDNS does not resolve govai.ae.
      # If the IP changes: update this in 04-deployment-main-service.yaml,
      # 05-deployment-parsing-indexing-service.yaml, and 05b-deployment-kb-worker.yaml,
      # then re-apply all three with `oc apply -f openshift/`.
      hostAliases:
        - ip: "10.231.255.253"
          hostnames:
            - "llmapi.govai.ae"
      imagePullSecrets:
        - name: quay-pull-secret
      # The database and tables are not created here: main-service does it
      # itself at startup (AUTO_APPLY_SCHEMA, default on) - see
      # app/services/db/schema_migrator.py. If the schema cannot be applied the container
      # exits with the reason in its log and the pod restarts.
      containers:
        - name: main-service
          image: quay-quay-registry.apps.dda-desc-az1-01.desccii.local/dda-desc/chatbot-main-service:<TAG>
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: main-service-config
            - secretRef:
                name: main-service-secrets
          volumeMounts:
            - name: file-store
              mountPath: /data/files
          # The port only opens once startup finishes, and startup now includes
          # creating the database and applying schema scripts on a first deploy
          # (a replica waiting on another's lock can add up to 2 minutes). Until
          # this succeeds the probes below do not run, so a slow first start is
          # not killed by the liveness probe. 60 x 5s = up to 5 minutes; a start
          # that is really stuck still fails and restarts, with the reason in the log.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          # Search now runs in-process here (BM25 index + hybrid-search fusion,
          # and - only if Atlas $vectorSearch is unavailable - a cosine-fallback
          # copy of the collection in memory), work that used to happen in
          # indexing-rpc-server's own pod. A starting point, not a measurement:
          # watch `oc adm top pod` under real traffic and raise these if the
          # knowledge base is large.
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: file-store
          persistentVolumeClaim:
            claimName: chatbot-file-store
