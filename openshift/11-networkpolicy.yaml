          port: 9998

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-main-service-egress
spec:
  podSelector:
    matchLabels:
      app: main-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.228.146.2/32
      ports:
        - protocol: TCP
          port: 1444
    - to:
        - ipBlock:
            cidr: 10.228.146.4/32
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 10.228.146.3/32
      ports:
        - protocol: TCP
          port: 27018
    - to:
        - ipBlock:
            cidr: 10.231.255.253/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.228.146.68/32
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 10.62.145.101/32
      ports:
        - protocol: TCP
          port: 443

