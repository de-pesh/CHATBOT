apiVersion: v1
kind: ConfigMap
metadata:
  name: main-service-config
data:
  DISABLE_AUTH: "True"
  TENANT_CONTEXT_ENABLED: "True"
  CHATBOT_BASE_URL: "http://chatbot-api.apps.dda-desc-az1-01.desccii.local"
  CORS_ALLOWED_ORIGINS: "http://chatbot-api.apps.dda-desc-az1-01.desccii.local,http://127.0.0.1:5500"

  DB_TYPE: "mssql"
  QUEUE_TYPE: "celery"
  CELERY_CONCURRENCY: "2"
  CHATBOT_QUEUE_NAME: "chatbot_queue"
  CHATBOT_QUEUE_DLQ_NAME: "chatbot_queue_dlq"
  CHATBOT_QUEUE_MAX_RETRIES: "3"

  STORAGE_TYPE: "quay"
  QUAY_REGISTRY: "quay-quay-registry.apps.dda-desc-az1-01.desccii.local"
  QUAY_REPOSITORY: "dda-desc/dca_files"
  QUAY_INSECURE: "true"

  KB_WORKER_ENABLED: "True"
  WORKER_BRPOP_TIMEOUT: "5"
  WORKER_ERROR_RETRY_DELAY: "5"

  INDEXING_SERVICE_URL: "http://parsing-indexing-service:8001"
  MONGODB_COLLECTION_NAME: "chatbot_policies"

  VECTOR_STORE: "mongo"
  MONGO_DATABASE_NAME: "chatbot"
  EMBEDDING_TYPE: "litellm"
  EMBEDDING_BASE_URL: "https://llmapi.govai.ae"
  EMBEDDING_MODEL_NAME: "qwen3-embedding-8b-mig"
  EMBEDDING_DIMENSION: "4096"

  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"

  LLM_TYPE: "litellm"
  LITELLM_BASE_URL: "https://llmapi.govai.ae"
  LITELLM_MODEL_NAME: "kimi-k2.5"
  LLM_FALLBACK_MODEL: "glm-5"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: indexing-rpc-server-config
data:
  STORAGE_TYPE: "quay"
  QUAY_REGISTRY: "quay-quay-registry.apps.dda-desc-az1-01.desccii.local"
  QUAY_REPOSITORY: "dda-desc/dca_files"
  QUAY_INSECURE: "true"

  VECTOR_STORE: "mongo"
  MONGO_DATABASE_NAME: "chatbot"
  VECTOR_COLLECTION_NAME: "chatbot_policies"
  VECTOR_SEARCH_EXACT: "false"
  PORT: "8001"

  EMBEDDING_TYPE: "litellm"
  EMBEDDING_BASE_URL: "https://llmapi.govai.ae"
  EMBEDDING_MODEL_NAME: "qwen3-embedding-8b-mig"
  EMBEDDING_DIMENSION: "4096"
  EMBEDDING_BATCH_SIZE: "8"

  TIKA_URL: "http://tika:9998"
  VISION_LLM_TYPE: "none"

  CELERY_CONCURRENCY: "2"
  CHATBOT_QUEUE_NAME: "chatbot_queue"
  CHATBOT_QUEUE_MAX_RETRIES: "3"
  WORKER_ERROR_RETRY_DELAY: "5"
  MAIN_SERVICE_URL: "http://main-service:8000"
